name: Dataset tests (no raw download)

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline dataset tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up CPython 3.13.1
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.1'
      - name: Install hash-locked Parquet reader
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-import.lock
      - name: Verify committed source/output lock consistency
        run: python scripts/dataset_lock.py --pins-only
      - name: Run all tests with network blocked and zero skips
        run: python scripts/run_tests.py
      - name: Validate preserved synthetic sample
        run: python scripts/check_phase2.py --expect-cities 12 --expect-edges 20
      - name: Check whitespace
        run: git diff --check

  cpp-tests:
    name: C++17 graph and Q1 tests (${{ matrix.os }}, ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        config: [Debug, Release]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up CPython 3.13.1
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.1'
      - name: Configure C++17
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - name: Compile graph, Q1, CLI and tests
        run: cmake --build build --config ${{ matrix.config }} --parallel 2
      - name: Run graph, loader, BFS, Q1 and CLI regressions
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --no-tests=error
